# See https://pre-commit.com for hook docs.
# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.aicl$|\.jsonl$|\.pdf$|\.svg$|\.png$|bun\.lock$'
      - id: end-of-file-fixer
        exclude: '\.aicl$|\.jsonl$|\.pdf$|\.svg$|\.png$|bun\.lock$'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: 'tsconfig\.json$|components\.json$|\.vscode/.*'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: 'docs/.*\.pdf$|datasets/.*\.jsonl$'
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^python/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^python/
        language_version: python3

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^python/src/aicl/
        additional_dependencies: []
        args: [--config-file=python/pyproject.toml]

  # Editor (TypeScript / JS)
  - repo: local
    hooks:
      - id: editor-eslint
        name: 'editor: eslint'
        entry: bash -c 'cd editor && bunx eslint .'
        language: system
        files: ^editor/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: false

      - id: editor-type-check
        name: 'editor: tsc --noEmit'
        entry: bash -c 'cd editor && bunx tsc --noEmit'
        language: system
        files: ^editor/.*\.(ts|tsx)$
        pass_filenames: false
