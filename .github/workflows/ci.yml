name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install AICL
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tui,dev]"

      - name: Run tests
        working-directory: python
        run: pytest tests/ -v

      - name: Smoke-test the CLI
        working-directory: python
        run: |
          aicl version
          aicl compile examples/showcase/01_blue_square.aicl
          aicl verify examples/showcase/01_blue_square.aicl

      - name: Lint (ruff + black --check + mypy)
        working-directory: python
        run: |
          ruff check src/ tests/ tools/ scripts/
          black --check src/ tests/ tools/ scripts/ || true
          mypy || true

  editor-build:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install editor deps
        working-directory: editor
        run: bun install --frozen-lockfile

      - name: Lint editor
        working-directory: editor
        run: |
          bun run lint || true
          bun run type-check || true

      - name: Build editor
        working-directory: editor
        run: bun run build
