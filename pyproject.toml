[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicl"
version = "2.1.0"
description = "AICL — Architecture Compilation Language: Auditable compilation with Proof of Origin. Every artifact has provenance, every proof is verifiable, every compilation is auditable."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Philippe-Antoine"},
]
keywords = ["aicl", "compiler", "explicable-compilation", "auditable-compilation", "provenance", "audit-coverage", "proof-of-origin", "risk-first", "architecture-as-code", "self-healing-runtime", "ownership-model", "multi-language-targets", "cryptographic-signing", "autonomous-compilation", "self-writing-compiler", "pattern-learning", "spec-evolution", "ai-code-generation", "cognet", "onnx", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
aicl = "aicl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
tui = ["textual>=0.40", "rich>=13.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
