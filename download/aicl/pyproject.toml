[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicl"
version = "0.5.0"
description = "AICL — Architecture Compilation Language: Auditable compilation where every artifact has provenance, risks are syntax, validations compile, and audit coverage is measurable"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Philippe-Antoine"},
]
keywords = ["aicl", "compiler", "explicable-compilation", "auditable-compilation", "provenance", "audit-coverage", "risk-first", "architecture-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
aicl = "aicl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
